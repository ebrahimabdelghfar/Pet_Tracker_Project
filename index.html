<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Health Monitor</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MQTT Client Library (Paho) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.js"></script>
    
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Leaflet.js for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        .metric-card {
            background-color: #1f2937; /* bg-gray-800 */
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: all 0.3s ease-in-out;
            border: 1px solid #374151; /* border-gray-700 */
        }
        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-animation 2s infinite;
        }
        .status-connected {
            background-color: #22c55e; /* bg-green-500 */
        }
        .status-disconnected {
            background-color: #ef4444; /* bg-red-500 */
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .battery {
            width: 80px;
            height: 40px;
            border: 3px solid #9ca3af; /* border-gray-400 */
            border-radius: 8px;
            position: relative;
            margin: 15px auto;
        }
        .battery:after {
            content: '';
            position: absolute;
            top: 50%;
            right: -12px;
            transform: translateY(-50%);
            width: 6px;
            height: 16px;
            background-color: #9ca3af; /* bg-gray-400 */
            border-radius: 0 3px 3px 0;
        }
        .battery-level {
            height: 100%;
            background-color: #22c55e; /* bg-green-500 */
            border-radius: 4px;
            transition: width 0.5s ease-in-out;
        }
        /* Toast Notification Style */
        #toast {
            visibility: hidden;
            transition: visibility 0s, opacity 0.5s linear;
            opacity: 0;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body class="text-white">

    <div class="container mx-auto p-4 md:p-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold">Pet Health Dashboard</h1>
                <p class="text-gray-400">Real-time monitoring for <span id="petNameHeader" class="font-semibold text-cyan-400">your pet</span>.</p>
            </div>
            <div class="flex items-center space-x-3">
                <span id="statusText" class="font-semibold text-gray-400">Disconnected</span>
                <span id="statusDot" class="status-dot status-disconnected"></span>
            </div>
        </header>

        <!-- Settings Panel -->
        <div class="mb-8">
            <details class="bg-gray-800 border border-gray-700 rounded-lg p-4" open>
                <summary class="font-semibold text-lg cursor-pointer">Connection & Device Settings</summary>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
                    <!-- MQTT Settings -->
                    <div class="space-y-2">
                        <label for="mqttServer" class="text-sm font-medium text-gray-300">MQTT Server URL</label>
                        <input type="text" id="mqttServer" value="mqtt://4.tcp.ngrok.io:11435" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label for="mqttUsername" class="text-sm font-medium text-gray-300">MQTT Username</label>
                        <input type="text" id="mqttUsername" value="hima" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    </div>
                     <div class="space-y-2">
                        <label for="mqttPassword" class="text-sm font-medium text-gray-300">MQTT Password</label>
                        <input type="password" id="mqttPassword" value="1234" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label for="petName" class="text-sm font-medium text-gray-300">Pet Name</label>
                        <input type="text" id="petName" placeholder="e.g., PET" value="PET" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                    </div>
                    <div class="col-span-1 md:col-span-2 lg:col-span-3">
                        <button id="connectButton" class="w-full lg:w-1/3 bg-cyan-600 hover:bg-cyan-700 rounded-md px-4 py-2 font-bold transition-colors">Connect</button>
                    </div>
                    <hr class="col-span-1 md:col-span-2 lg:col-span-3 border-gray-600 my-2">
                    <!-- Publish to ESP32 -->
                    <div class="space-y-2">
                        <label for="wifiSSID" class="text-sm font-medium text-gray-300">WiFi SSID</label>
                        <div class="flex gap-2">
                            <input type="text" id="wifiSSID" placeholder="New WiFi SSID" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <button id="publishSsidButton" class="bg-indigo-600 hover:bg-indigo-700 rounded-md px-4 py-2 font-bold transition-colors">Publish</button>
                        </div>
                    </div>
                     <div class="space-y-2">
                        <label for="wifiPassword" class="text-sm font-medium text-gray-300">WiFi Password</label>
                        <div class="flex gap-2">
                            <input type="password" id="wifiPassword" placeholder="New WiFi Password" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <button id="publishPasswordButton" class="bg-indigo-600 hover:bg-indigo-700 rounded-md px-4 py-2 font-bold transition-colors">Publish</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label for="btName" class="text-sm font-medium text-gray-300">Bluetooth Name</label>
                         <div class="flex gap-2">
                            <input type="text" id="btName" placeholder="New Bluetooth Name" class="w-full bg-gray-700 border border-gray-600 rounded-md px-3 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
                            <button id="publishBtButton" class="bg-indigo-600 hover:bg-indigo-700 rounded-md px-4 py-2 font-bold transition-colors">Publish</button>
                        </div>
                    </div>
                </div>
            </details>
        </div>

        <!-- Main Dashboard Grid -->
        <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Heart Rate -->
            <div class="metric-card lg:col-span-2">
                <h2 class="text-xl font-semibold text-gray-300 mb-2">Heart Rate</h2>
                <div class="flex items-center justify-between">
                    <p class="text-5xl font-bold"><span id="heartRateValue">--</span> <span class="text-2xl text-gray-400">BPM</span></p>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg>
                </div>
                <div class="mt-4 h-48"><canvas id="heartRateChart"></canvas></div>
            </div>

            <!-- SpO2 -->
            <div class="metric-card">
                <h2 class="text-xl font-semibold text-gray-300 mb-2">SpO2</h2>
                <p class="text-5xl font-bold"><span id="spo2Value">--</span> <span class="text-2xl text-gray-400">%</span></p>
                <div class="mt-4 h-56"><canvas id="spo2Chart"></canvas></div>
            </div>

            <!-- Temperature & Battery -->
            <div class="metric-card flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-semibold text-gray-300 mb-2">Temperature</h2>
                    <p class="text-5xl font-bold"><span id="temperatureValue">--</span> <span class="text-2xl text-gray-400">°C</span></p>
                </div>
                <div>
                    <h2 class="text-xl font-semibold text-gray-300 mb-2 mt-6">Battery</h2>
                    <div class="flex items-center justify-center gap-4">
                        <div class="battery">
                            <div id="batteryLevel" class="battery-level" style="width: 0%;"></div>
                        </div>
                        <p class="text-3xl font-bold"><span id="batteryPercentage">--</span>%</p>
                    </div>
                </div>
            </div>
            
            <!-- GPS Location -->
            <div class="metric-card md:col-span-2 lg:col-span-2">
                <h2 class="text-xl font-semibold text-gray-300 mb-4">GPS Location</h2>
                <div class="relative">
                    <div id="map" class="h-80 rounded-md bg-gray-700"></div>
                    <button id="centerMapButton" class="absolute top-2 right-2 bg-gray-800 bg-opacity-75 hover:bg-opacity-100 p-2 rounded-md z-[1000]" title="Center on Pet">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                        </svg>
                    </button>
                </div>
                <div class="flex justify-around mt-4 text-center">
                    <div>
                        <p class="text-gray-400">Latitude</p>
                        <p id="latitudeValue" class="font-semibold text-lg">--</p>
                    </div>
                    <div>
                        <p class="text-gray-400">Longitude</p>
                        <p id="longitudeValue" class="font-semibold text-lg">--</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-red-600 text-white py-2 px-4 rounded-lg shadow-lg z-50">
        <p id="toastMessage"></p>
    </div>

    <script>
        // DOM Elements
        const connectButton = document.getElementById('connectButton');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        
        const heartRateValue = document.getElementById('heartRateValue');
        const spo2Value = document.getElementById('spo2Value');
        const temperatureValue = document.getElementById('temperatureValue');
        const batteryPercentage = document.getElementById('batteryPercentage');
        const batteryLevel = document.getElementById('batteryLevel');
        const latitudeValue = document.getElementById('latitudeValue');
        const longitudeValue = document.getElementById('longitudeValue');

        const petNameHeader = document.getElementById('petNameHeader');
        
        const publishSsidButton = document.getElementById('publishSsidButton');
        const publishPasswordButton = document.getElementById('publishPasswordButton');
        const publishBtButton = document.getElementById('publishBtButton');
        const centerMapButton = document.getElementById('centerMapButton');

        // MQTT Client
        let mqttClient;
        let isConnected = false;

        // Map & Marker
        let map;
        let marker;
        let petLocation = { lat: null, lng: null };

        // Chart instances
        let heartRateChart, spo2Chart;

        // --- Toast Notification Logic ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // --- Chart Initialization ---
        function createChart(ctx, label) {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderColor: '#22d3ee', // cyan-400
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: false },
                        y: { 
                            beginAtZero: false,
                            grid: { color: '#374151' }, // gray-700
                            ticks: { color: '#d1d5db' } // gray-300
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        function updateChart(chart, value) {
            const MAX_DATA_POINTS = 30;
            chart.data.labels.push(new Date().toLocaleTimeString());
            chart.data.datasets[0].data.push(value);

            if (chart.data.labels.length > MAX_DATA_POINTS) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update('none'); // 'none' for no animation
        }
        
        // --- Map Logic ---
        function initializeMap() {
            map = L.map('map').setView([30.0444, 31.2357], 5); // Default to Cairo, Egypt
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            marker = L.marker(map.getCenter()).addTo(map)
                .bindPopup('Pet\'s Location');
        }

        function updateMapPosition() {
            if (petLocation.lat !== null && petLocation.lng !== null) {
                const newLatLng = [petLocation.lat, petLocation.lng];
                if (map.getBounds().contains(newLatLng)) {
                    // If marker is in view, just move it without changing view
                    marker.setLatLng(newLatLng);
                } else {
                    // If marker is out of view, move map to it
                    map.setView(newLatLng, 15);
                    marker.setLatLng(newLatLng);
                }
                 marker.openPopup();
            }
        }

        // --- MQTT Logic ---
        function connectToMqtt() {
            let server = document.getElementById('mqttServer').value;
            const petName = document.getElementById('petName').value;
            const username = document.getElementById('mqttUsername').value;
            const password = document.getElementById('mqttPassword').value;

            if (!server || !petName) {
                showToast('Please provide MQTT Server URL and Pet Name.');
                return;
            }
            
            if (isConnected && mqttClient) {
                mqttClient.disconnect();
            }

            // The Paho JS client requires a WebSocket URL (ws:// or wss://).
            // Automatically correct mqtt:// to ws:// for user convenience.
            if (server.startsWith("mqtt://")) {
                server = server.replace("mqtt://", "ws://");
                document.getElementById('mqttServer').value = server; // Update the input field
            }

            const clientId = "pet-dashboard-" + Math.random().toString(16).substr(2, 8);
            
            const ws_protocol = server.startsWith("wss://") ? "wss" : "ws";
            const host_port_array = server.replace(ws_protocol + "://", "").split(":");
            const host = host_port_array[0];
            const port = parseInt(host_port_array[1]);

            if (isNaN(port)) {
                showToast('Invalid URL. Use format ws://host:port or wss://host:port');
                return;
            }

            mqttClient = new Paho.MQTT.Client(host, port, clientId);

            // Set callback handlers
            mqttClient.onConnectionLost = onConnectionLost;
            mqttClient.onMessageArrived = onMessageArrived;

            statusText.textContent = 'Connecting...';
            connectButton.textContent = 'Connecting...';
            connectButton.disabled = true;

            // Connect the client
            mqttClient.connect({
                userName: username,
                password: password,
                onSuccess: onConnect,
                onFailure: onFailure,
                useSSL: ws_protocol === "wss"
            });
        }

        function onConnect() {
            console.log("Connected to MQTT Broker!");
            isConnected = true;
            statusText.textContent = 'Connected';
            statusDot.classList.remove('status-disconnected');
            statusDot.classList.add('status-connected');
            connectButton.textContent = 'Disconnect';
            connectButton.disabled = false;
            
            const petName = document.getElementById('petName').value;
            petNameHeader.textContent = petName;

            // Reset location on new connection
            petLocation = { lat: null, lng: null };

            // Subscribe to topics
            const topics = [
                `${petName}/battery/precentage`,
                `${petName}/gps/latitude`,
                `${petName}/gps/longitude`,
                `${petName}/activity/spo2`,
                `${petName}/activity/heart_rate`,
                `${petName}/activity/temperature`
            ];
            
            topics.forEach(topic => {
                console.log(`Subscribing to: ${topic}`);
                mqttClient.subscribe(topic);
            });
        }

        function onFailure(response) {
            console.error("Connection failed: " + response.errorMessage);
            isConnected = false;
            statusText.textContent = 'Failed';
            connectButton.textContent = 'Connect';
            connectButton.disabled = false;
            showToast('MQTT Connection Failed. Check credentials or server URL.');
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Connection lost: " + responseObject.errorMessage);
                isConnected = false;
                statusText.textContent = 'Disconnected';
                statusDot.classList.remove('status-connected');
                statusDot.classList.add('status-disconnected');
                connectButton.textContent = 'Connect';
                connectButton.disabled = false;
                petLocation = { lat: null, lng: null };
            }
        }

        function onMessageArrived(message) {
            const topic = message.destinationName;
            const payload = message.payloadString;
            console.log(`Message arrived on topic ${topic}: ${payload}`);
            
            if (topic.endsWith('/activity/heart_rate')) {
                const hr = parseFloat(payload).toFixed(0);
                heartRateValue.textContent = hr;
                updateChart(heartRateChart, hr);
            } else if (topic.endsWith('/activity/spo2')) {
                const spo2 = parseFloat(payload).toFixed(0);
                spo2Value.textContent = spo2;
                updateChart(spo2Chart, spo2);
            } else if (topic.endsWith('/activity/temperature')) {
                temperatureValue.textContent = parseFloat(payload).toFixed(1);
            } else if (topic.endsWith('/battery/precentage')) {
                const percentage = parseFloat(payload).toFixed(0);
                batteryPercentage.textContent = percentage;
                batteryLevel.style.width = `${percentage}%`;
            } else if (topic.endsWith('/gps/latitude')) {
                const lat = parseFloat(payload);
                latitudeValue.textContent = lat.toFixed(6);
                petLocation.lat = lat;
                updateMapPosition();
            } else if (topic.endsWith('/gps/longitude')) {
                const lng = parseFloat(payload);
                longitudeValue.textContent = lng.toFixed(6);
                petLocation.lng = lng;
                updateMapPosition();
            }
        }
        
        function publishMessage(topic, payload) {
            if (!isConnected) {
                showToast("Not connected to MQTT broker. Please connect first.");
                return;
            }
            const message = new Paho.MQTT.Message(payload);
            message.destinationName = topic;
            mqttClient.send(message);
            console.log(`Published to ${topic}: ${payload}`);
        }
        
        // --- Event Listeners ---
        connectButton.addEventListener('click', () => {
            if (isConnected) {
                mqttClient.disconnect();
            } else {
                connectToMqtt();
            }
        });
        
        publishSsidButton.addEventListener('click', () => {
            const petName = document.getElementById('petName').value;
            const ssid = document.getElementById('wifiSSID').value;
            if (!petName || !ssid) {
                showToast("Pet Name and WiFi SSID must be set.");
                return;
            }
            const topic = `${petName}/wifi/ssid`;
            publishMessage(topic, ssid);
        });

        publishPasswordButton.addEventListener('click', () => {
            const petName = document.getElementById('petName').value;
            const password = document.getElementById('wifiPassword').value;
            if (!petName || !password) {
                showToast("Pet Name and WiFi Password must be set.");
                return;
            }
            const topic = `${petName}/wifi/password`;
            publishMessage(topic, password);
        });

        publishBtButton.addEventListener('click', () => {
            const petName = document.getElementById('petName').value;
            const btName = document.getElementById('btName').value;
            if (!petName || !btName) {
                showToast("Pet Name and Bluetooth Name must be set.");
                return;
            }
            const topic = `${petName}/bluetooth/name`;
            publishMessage(topic, btName);
        });
        
        centerMapButton.addEventListener('click', () => {
            if (petLocation.lat !== null && petLocation.lng !== null) {
                map.setView([petLocation.lat, petLocation.lng], 15);
            } else {
                showToast("No location data received yet.");
            }
        });

        // --- Initial Setup on page load ---
        window.onload = () => {
            const hrCtx = document.getElementById('heartRateChart').getContext('2d');
            heartRateChart = createChart(hrCtx, 'Heart Rate (BPM)');

            const spo2Ctx = document.getElementById('spo2Chart').getContext('2d');
            spo2Chart = createChart(spo2Ctx, 'SpO2 (%)');
            
            initializeMap();
        };

    </script>

</body>
</html>
