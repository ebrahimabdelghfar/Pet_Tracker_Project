# Mosquitto MQTT Broker Configuration - MINIMAL

# MUST be first: per_listener_settings
per_listener_settings true

# Default listener on 1883 (standard MQTT port)
listener 1883
protocol mqtt
allow_anonymous false

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Authentication
password_file /mosquitto/config/passwords.txt

# Logging
log_dest stdout
log_type all
log_timestamp true
log_timestamp true
