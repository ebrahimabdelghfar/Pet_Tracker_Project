# Mosquitto MQTT Broker Configuration

# MUST be first: per_listener_settings
per_listener_settings true

# Default listener
listener 1883
protocol mqtt
max_connections -1
max_queued_messages 1000

# Secure listener (TLS/SSL) - DISABLED FOR NOW (no certificates)
# Uncomment when you have SSL certificates
# listener 8883
# protocol mqtt
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# tls_version tlsv1.2

# WebSocket listener
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Authentication
password_file /mosquitto/config/passwords.txt
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true

# Message settings
message_size_limit 0
max_inflight_messages 20
max_keepalive 60

# Cluster support (commented out, enable if needed)
# cluster_username cluster_user
# cluster_password cluster_password
