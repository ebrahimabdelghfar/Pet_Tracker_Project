# Mosquitto MQTT Broker Configuration - MINIMAL

# MUST be first: per_listener_settings
per_listener_settings true

# Default listener on 1883 (standard MQTT port)
listener 1883
protocol mqtt
password_file /mosquitto/config/passwords.txt
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
log_timestamp true
