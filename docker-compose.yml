version: '3.8'

services:
  mosquitto:
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    container_name: mosquitto-broker
    ports:
      - "1883:1883"  # MQTT protocol
      - "8883:8883"  # MQTT over TLS
      - "9001:9001"  # WebSocket
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    environment:
      - MOSQUITTO_ADMIN_PASSWORD=your_secure_password
      # Format: "user1:pass1,user2:pass2"
      - MOSQUITTO_ADDITIONAL_USERS=pet_tracker:pet_tracker_pass,dashboard:dashboard_pass
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883", "-t", "$SYS/broker/clients/total"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mosquitto_data:
  mosquitto_logs:
