name: Deploy Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard.py'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dash dash-bootstrap-components dash-daq paho-mqtt pandas plotly
      
      - name: Verify dashboard.py syntax
        run: |
          python -m py_compile dashboard.py
          echo "✓ dashboard.py syntax is valid"
      
      - name: Create deployment package
        run: |
          mkdir -p dist
          cp dashboard.py dist/
          cp -r index.html dist/ 2>/dev/null || true
          ls -la dist/
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dashboard-build
          path: dist/
          retention-days: 30
      
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: dashboard.pet-tracker.local

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Deployment Success
        run: |
          echo "✓ Dashboard deployment completed successfully!"
          echo "Artifact available: dashboard-build"
