name: Deploy Mosquitto MQTT Broker

on:
  push:
    branches:
      - main
    paths:
      - 'mosquitto/**'
      - '.github/workflows/deploy-mosquitto.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mosquitto

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mosquitto
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != ''
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MOSQUITTO_USER: hima
          MOSQUITTO_PASSWORD: himaet23
        run: |
          # Check if required secrets are set
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "⚠️  SKIPPING SERVER DEPLOYMENT"
            echo "Required secrets not configured: DEPLOY_KEY, DEPLOY_HOST, DEPLOY_USER"
            echo "To enable server deployment, add these secrets to your GitHub repository:"
            echo "  1. Go to Settings → Secrets and variables → Actions"
            echo "  2. Add DEPLOY_KEY (SSH private key)"
            echo "  3. Add DEPLOY_HOST (server IP address)"
            echo "  4. Add DEPLOY_USER (SSH username)"
            exit 0
          fi
          
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # Deploy using SSH (customize as needed)
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker stop mosquitto || true
          docker rm mosquitto || true
          docker run -d \
            --name mosquitto \
            -p 1883:1883 \
            -p 8883:8883 \
            -e MOSQUITTO_ADMIN_PASSWORD=himaet23 \
            -e MOSQUITTO_ADDITIONAL_USERS=hima:himaet23 \
            -v /etc/mosquitto/config:/mosquitto/config \
            -v /mosquitto/data:/mosquitto/data \
            -v /mosquitto/log:/mosquitto/log \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          
          # Verify broker is running
          sleep 5
          docker logs mosquitto
          EOF

      - name: Output Broker Connection Info
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "=========================================="
          echo "✅ MOSQUITTO MQTT BROKER DEPLOYED"
          echo "=========================================="
          echo ""
          echo "🔗 BROKER CONNECTION DETAILS:"
          echo "   Hostname/IP: ${{ secrets.DEPLOY_HOST }}"
          echo "   MQTT Port: 1883"
          echo "   MQTT+TLS Port: 8883"
          echo "   WebSocket Port: 9001"
          echo ""
          echo "🔐 CREDENTIALS:"
          echo "   Username: hima"
          echo "   Password: himaet23"
          echo ""
          echo "🧪 TEST CONNECTION:"
          echo "   mosquitto_sub -h ${{ secrets.DEPLOY_HOST }} -p 1883 \\"
          echo "     -u hima -P himaet23 -t 'test/topic'"
          echo ""
          echo "📱 UPDATE YOUR MQTT_CONFIG:"
          echo "   const char* mqtt_server = \"${{ secrets.DEPLOY_HOST }}\";"
          echo "   const int mqtt_port = 1883;"
          echo "   const char* mqtt_user = \"hima\";"
          echo "   const char* mqtt_password = \"himaet23\";"
          echo ""
          echo "=========================================="
          echo ""
